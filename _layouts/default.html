<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Space+Grotesk:wght@400;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>
  <canvas class="hex-canvas" id="hexCanvas"></canvas>
  <div class="grain"></div>

  <header class="site-header">
    <div class="container header-container">
      <a href="{{ '/' | relative_url }}" class="logo-link">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-icon" role="img" aria-label="Frontlane Studio Monogram">
          <path d="M40 160L160 40" stroke="currentColor" stroke-width="16" stroke-linecap="square"></path>
          <path d="M40 100L100 40" stroke="currentColor" stroke-width="16" stroke-linecap="square"></path>
          <path d="M100 160L160 100" stroke="currentColor" stroke-width="16" stroke-linecap="square"></path>
          <rect x="144" y="24" width="32" height="32" fill="currentColor"></rect>
        </svg>
        <span class="logo-text">Frontlane <span class="logo-subtext">Static</span></span>
      </a>
      
      <nav class="site-nav">
        <a href="https://frontlanestudio.com" target="_blank" class="nav-link">Main Site</a>
        <a href="https://github.com/frontlanestudio/frontlane-static" target="_blank" class="nav-link btn-primary glow-btn">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; {{ site.time | date: "%Y" }} Frontlane Studio. All rights reserved.</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/canvas-bg.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/animations.js' | relative_url }}"></script>
</body>
</html>
