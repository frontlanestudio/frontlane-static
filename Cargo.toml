[package]
name = "frontlane-static"
version = "0.1.0"
edition = "2024"
description = "Turn dynamic enterprise sites into blazing-fast static clones."
repository = "https://github.com/frontlanestudio/frontlane-static"
license = "MIT"

[dependencies]
anyhow = "1.0.103"
base64 = "0.22"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
csv = "1.4.0"
dashmap = "6.2.1"
futures-util = "0.3.32"
headless_chrome = "1.0.22"
html2md = "0.2.15"
indicatif = "0.18.6"
lazy_static = "1.5.0"
mime_guess = "2.0.5"
pathdiff = "0.2.3"
regex = "1.13.0"
reqwest = { version = "0.13.4", features = ["stream"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
sitemap = "0.4.1"
spider = { version = "2.52.9", features = ["chrome", "sitemap"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = "1.7.2"
predicates = "3.1.4"
tempfile = "3.27.0"
